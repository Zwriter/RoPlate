name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore DfaSimulator.slnx

      - run: dotnet build DfaSimulator.slnx --no-restore

      - run: dotnet test DfaSimulator.slnx --no-build --settings tests/Dfa.Tests/coverage.runsettings --results-directory coverage

      # Constitution quality gate: line coverage of Dfa.Core must stay at or above 70%.
      - name: Check Dfa.Core coverage
        run: |
          rate=$(grep -o -m1 'line-rate="[0-9.]*"' coverage/*/coverage.cobertura.xml | head -1 | cut -d'"' -f2)
          echo "Dfa.Core line coverage: $rate"
          awk -v r="$rate" 'BEGIN { exit !(r >= 0.70) }'

      # Constitution quality gate: formatting must match .editorconfig.
      - run: dotnet format DfaSimulator.slnx --verify-no-changes --no-restore
